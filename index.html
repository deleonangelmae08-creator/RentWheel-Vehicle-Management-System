    function select(id,label,options,value="",full=false){return `<div class="field ${full?"full":""}"><label for="${id}">${label}</label><select id="${id}">${options.map(o=>`<option ${o===value?"selected":""}>${o}</option>`).join("")}</select><small id="${id}-error"></small></div>`}
    function openVehicleForm(id){let v=id?vehicle(id):{};modal(id?"Edit Vehicle":"Add Vehicle",`<form id="vehicle-form"><div class="form-grid">${field("plate","Plate number",v.plate_number)}${field("vnumber","Vehicle number",v.vehicle_number)}${field("brand","Brand",v.brand)}${field("model","Model",v.model)}${field("color","Color",v.color)}${field("year","Year",v.year||"", "number")}${field("rate","Rental rate (PHP/day)",v.rental_rate||"","number")}${select("vstatus","Current status",["Available","Rented","Maintenance","Reported Issue"],v.status||"Available")}</div></form>`,`<button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="primary-btn" onclick="saveVehicle('${id||""}')">Save Vehicle</button>`)}
    function saveVehicle(id){let data={plate_number:val("plate"),vehicle_number:val("vnumber"),brand:val("brand"),model:val("model"),color:val("color"),year:+val("year"),rental_rate:+val("rate"),status:val("vstatus")};if(Object.entries(data).some(([k,v])=>!v&&k!=="year")||data.year<1990||data.rental_rate<=0)return formError("plate","Complete all required fields with a valid year and rate.");if(id)Object.assign(vehicle(id),data);else vehicles.push({vehicle_id:nextId(vehicles,"vehicle_id","VEH"),...data});persistData();closeModal();render();toast(id?"Vehicle updated.":"Vehicle added to fleet.")}
    function openCustomerForm(id){let c=id?customer(id):{};modal(id?"Edit Customer":"Add Customer",`<div class="form-grid">${field("first","First name",c.first_name)}${field("last","Last name",c.last_name)}${field("phone","Phone number",c.phone_number)}${field("email","Email",c.email,"email")}${field("address","Address",c.address,"text",true)}${field("license","License number",c.license_number,"text",true)}</div>`,`<button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="primary-btn" onclick="saveCustomer('${id||""}')">Save Customer</button>`)}
    function saveCustomer(id){let data={first_name:val("first"),last_name:val("last"),phone_number:val("phone"),email:val("email"),address:val("address"),license_number:val("license")};if(Object.values(data).some(v=>!v)||!data.email.includes("@"))return formError("email","Enter all fields and a valid email.");if(id)Object.assign(customer(id),data);else customers.push({customer_id:nextId(customers,"customer_id","CUS"),...data});persistData();closeModal();render();toast(id?"Customer updated.":"Customer record created.")}
    function openRentalForm(){let available=vehicles.filter(v=>v.status==="Available");modal("Create Rental",`<div class="form-grid">${select("rcustomer","Customer",customers.map(c=>`${c.customer_id} — ${c.first_name} ${c.last_name}`))}${select("rvehicle","Available vehicle",available.map(v=>`${v.vehicle_id} — ${v.vehicle_number} ${v.brand} ${v.model}`))}${field("rdate","Rental date","2026-09-30","date")}${field("rdue","Return due date","2026-10-03","date")}${select("rstatus","Rental status",["Reserved","Active"])}</div>${available.length?"":"<p style='color:#b73535'>No available vehicles. Update fleet availability first.</p>"}`,`<button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="primary-btn" onclick="saveRental()" ${available.length?"":"disabled"}>Create Rental</button>`)}
    function saveRental(){let cid=val("rcustomer").slice(0,7),vid=val("rvehicle").slice(0,7),status=val("rstatus");if(!cid||!vid||!val("rdate")||!val("rdue")||val("rdue")<val("rdate"))return formError("rdue","Choose a due date after the rental date.");let v=vehicle(vid);if(v.status!=="Available")return formError("rvehicle","This vehicle is no longer available.");rentals.unshift({rental_id:nextId(rentals,"rental_id","RNT"),customer_id:cid,vehicle_id:vid,admin_id:admin.admin_id,rental_date:val("rdate"),return_date:"",return_due_date:val("rdue"),rental_status:status,vehicle_status:status==="Active"?"Rented":"Available"});if(status==="Active")v.status="Rented";persistData();closeModal();setView("rentals");toast("Rental agreement created.")}
    function openOnlineRentalForm(vehicleId){const today=new Date().toISOString().slice(0,10),tomorrow=new Date(Date.now()+86400000).toISOString().slice(0,10);modal("Reserve vehicle",`<p style="margin:0 0 16px;color:#68768b">${esc(vehicle(vehicleId).brand)} ${esc(vehicle(vehicleId).model)} · ${money(vehicle(vehicleId).rental_rate)} per day</p><div class="form-grid">${field("onlineStart","Rental date",today,"date")}${field("onlineDue","Return date",tomorrow,"date")}</div>`,`<button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="primary-btn" onclick="saveOnlineRental('${vehicleId}')">Confirm reservation</button>`)}
    async function saveOnlineRental(vehicleId){const start=val("onlineStart"),due=val("onlineDue");if(!start||!due||due<=start)return formError("onlineDue","Choose a return date after the rental date.");try{const result=await requestApi("/api/customer/rentals",{method:"POST",body:JSON.stringify({vehicle_id:vehicleId,rental_date:start,return_due_date:due})});applyState(result.state);closeModal();renderCustomerDashboard();toast("Reservation saved.")}catch(error){toast(error.message)}}
    function openReturnForm(){let active=rentals.filter(r=>["Active","Overdue"].includes(r.rental_status));modal("Record Return",`<div class="form-grid">${select("returnRental","Rental",active.map(r=>`${r.rental_id} — ${name(r.customer_id)} · ${vehicle(r.vehicle_id).vehicle_number}`))}${field("returnDate","Return date","2026-09-30","date")}${select("condition","Condition status",["Good","Minor Damage","Major Damage","Needs Maintenance"])}${field("fee","Late fee (PHP)","0","number")}</div>`, `<button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="primary-btn" onclick="saveReturn()">Record Return</button>`)}
    function saveReturn(){let rid=val("returnRental").slice(0,7),r=rental(rid),cond=val("condition");if(!r)return formError("returnRental","Choose an active rental.");r.return_date=val("returnDate");r.rental_status="Completed";r.vehicle_status=["Needs Maintenance","Major Damage"].includes(cond)?"Maintenance":"Available";vehicle(r.vehicle_id).status=r.vehicle_status;returns.unshift({return_id:nextId(returns,"return_id","RET"),rental_id:rid,return_date:r.return_date,condition_status:cond,late_fee:+val("fee")||0});persistData();closeModal();setView("returns");toast("Return recorded and fleet status updated.")}
    function openPaymentForm(){modal("Record Payment",`<div class="form-grid">${select("payRental","Rental",rentals.map(r=>`${r.rental_id} — ${name(r.customer_id)}`))}${field("payDate","Payment date","2026-09-30","date")}${field("amount","Amount (PHP)","","number")}${select("method","Payment method",["Cash","Card","Bank Transfer","Other"])}${select("payStatus","Payment status",["Pending","Paid","Partial","Refunded"],"Paid")}</div>`,`<button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="primary-btn" onclick="savePayment()">Record Payment</button>`)}
    function savePayment(){if(+val("amount")<=0)return formError("amount","Enter a positive payment amount.");payments.unshift({payment_id:nextId(payments,"payment_id","PAY"),rental_id:val("payRental").slice(0,7),payment_date:val("payDate"),amount:+val("amount"),payment_method:val("method"),payment_status:val("payStatus")});persistData();closeModal();setView("payments");toast("Payment record added.")}
    function openProfileForm(){modal("Edit Administrator Profile",`<div class="form-grid">${field("username","Username",admin.username)}${field("fullname","Full name",admin.full_name)}${field("adminemail","Email",admin.email,"email")}</div>`,`<button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="primary-btn" onclick="saveProfile()">Save Profile</button>`)}
    function saveProfile(){if(!val("username")||!val("fullname")||!val("adminemail").includes("@"))return formError("adminemail","Complete all fields with a valid email.");admin.username=val("username");admin.full_name=val("fullname");admin.email=val("adminemail");$("#side-admin-name").textContent=admin.full_name;closeModal();render();toast("Administrator profile updated.")}
    function showVehicle(id){let v=vehicle(id),hist=rentals.filter(r=>r.vehicle_id===id);showDetail("Vehicle Details",v,hist.map(r=>`${r.rental_id} · ${name(r.customer_id)} · ${r.rental_status}`),"Rental history")}
    function showCustomer(id){let c=customer(id),hist=rentals.filter(r=>r.customer_id===id),paid=payments.filter(p=>hist.some(r=>r.rental_id===p.rental_id)).reduce((a,p)=>a+p.amount,0);showDetail("Customer Details",{...c,payment_summary:money(paid)},hist.map(r=>`${r.rental_id} · ${vehicle(r.vehicle_id).vehicle_number} · ${r.rental_status}`),"Rental history")}
    function showRental(id){let r=rental(id),paid=payments.filter(p=>p.rental_id===id).reduce((a,p)=>a+p.amount,0),days=Math.max(1,Math.ceil((new Date(r.return_due_date)-new Date(r.rental_date))/86400000)),total=days*vehicle(r.vehicle_id).rental_rate;showDetail("Rental Details",{...r,customer:name(r.customer_id),vehicle:`${vehicle(r.vehicle_id).brand} ${vehicle(r.vehicle_id).model}`,estimated_total:money(total),payments_received:money(paid),outstanding_balance:money(Math.max(0,total-paid))},[],"")}
    function showReturn(id){let r=returns.find(x=>x.return_id===id);showDetail("Return Details",r,[],"")}
    function showPayment(id){showDetail("Payment Details",payments.find(x=>x.payment_id===id),[],"")}
    function showDetail(title,obj,items,label){modal(title,`<div class="detail-grid">${Object.entries(obj).filter(([k])=>!["password"].includes(k)).map(([k,v])=>`<div class="detail"><span>${k.replaceAll("_"," ")}</span><b>${esc(v||"—")}</b></div>`).join("")}</div>${label?`<h4 style="margin:22px 0 8px">${label}</h4>${items.length?`<div class="panel" style="border-radius:9px"><div class="panel-body">${items.map(x=>`<div style="padding:7px 0;border-bottom:1px solid #edf0f4;font-size:13px">${x}</div>`).join("")}</div></div>`:"<p style='color:#6b778c;font-size:13px'>No related rental records.</p>"}`:""}`,`<button class="primary-btn" onclick="closeModal()">Close</button>`)}
    function editVehicle(id){openVehicleForm(id)} function editCustomer(id){openCustomerForm(id)} function editRental(id){let r=rental(id);modal("Update Rental",`<p style="color:#68768b;font-size:13px">Change the rental status for <b>${id}</b>. Cancelling a rental makes its vehicle available again.</p>${select("editRentalStatus","Rental status",["Reserved","Active","Completed","Cancelled","Overdue"],r.rental_status)}`,`<button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="primary-btn" onclick="saveRentalEdit('${id}')">Save Changes</button>`)}
    function saveRentalEdit(id){let r=rental(id),next=val("editRentalStatus");r.rental_status=next;if(next==="Cancelled"){r.vehicle_status="Available";vehicle(r.vehicle_id).status="Available"}else if(next==="Active"){r.vehicle_status="Rented";vehicle(r.vehicle_id).status="Rented"}persistData();closeModal();render();toast("Rental status updated.")}
    function confirmDelete(type,id){modal("Confirm deletion",`<p style="margin:0;color:#526078;line-height:1.55">Delete <b>${id}</b>? This action removes the selected ${type} from this prototype.</p>`,`<button class="secondary-btn" onclick="closeModal()">Cancel</button><button class="danger-btn" onclick="deleteRecord('${type}','${id}')">Delete</button>`)}
    function deleteRecord(type,id){if(type==="vehicle")vehicles=vehicles.filter(x=>x.vehicle_id!==id);if(type==="customer")customers=customers.filter(x=>x.customer_id!==id);if(type==="rental")rentals=rentals.filter(x=>x.rental_id!==id);persistData();closeModal();render();toast(`${type[0].toUpperCase()+type.slice(1)} deleted.`)}
    function val(id){return $("#"+id).value.trim()} function formError(id,msg){$("#"+id+"-error").textContent=msg;$("#"+id).focus()}
    function bindView(){document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>setView(b.dataset.view))}
    const oldLoginForm=$("#login-form"),freshLoginForm=oldLoginForm.cloneNode(true);oldLoginForm.replaceWith(freshLoginForm);freshLoginForm.addEventListener("submit",submitAuth);
    $("#admin-entry").onclick=()=>setAuthMode(authMode==="admin"?"customer":"admin");$("#customer-entry").onclick=()=>setAuthMode("customer");$("#signup-toggle").onclick=()=>{authView=authView==="signup"?"login":"signup";renderAuth()};
    $("#signout-btn").onclick=async()=>{await requestApi("/api/logout",{method:"POST",body:"{}"});$("#app-shell").classList.add("hidden");$("#login-screen").classList.remove("hidden");setAuthMode("admin")};$("#customer-signout").onclick=async()=>{await requestApi("/api/logout",{method:"POST",body:"{}"});$("#customer-shell").classList.add("hidden");$("#login-screen").classList.remove("hidden");activeCustomer=null;setAuthMode("customer")};
    $("#menu-button").onclick=()=>{$("#sidebar").classList.toggle("open");$("#sidebar-backdrop").classList.toggle("hidden")};$("#sidebar-backdrop").onclick=()=>{$("#sidebar").classList.remove("open");$("#sidebar-backdrop").classList.add("hidden")};$("#modal-layer").onclick=e=>{if(e.target===$("#modal-layer"))closeModal()};
    renderAuth();lucide.createIcons();initializeApp();
  </script>
